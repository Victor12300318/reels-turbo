services:
  reels-api:
    build: .
    container_name: reels-api
    ports:
      - "${API_PORT:-8008}:8000"
    env_file:
      - .env
    environment:
      - LOCAL_VIDEOS_DIR=/app/videos
      - DATABASE_URL=${DATABASE_URL}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-reels-turbo}
      - S3_ENDPOINT=${S3_ENDPOINT:-crm-minio.xjbony.easypanel.host}
      - S3_PORT=${S3_PORT:-443}
      - S3_SSL=${S3_SSL:-true}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_PUBLIC_CUSTOM_DOMAIN=${S3_PUBLIC_CUSTOM_DOMAIN:-https://crm-minio.xjbony.easypanel.host/reels-turbo}
      - META_APP_ID=${META_APP_ID:-1337818285188918}
      - META_APP_SECRET=${META_APP_SECRET}
      - INSTAGRAM_ACCOUNT_ID=${INSTAGRAM_ACCOUNT_ID}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]

  reels-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reels-frontend
    ports:
      - "${FRONTEND_PORT:-3008}:3008"
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3008
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-8008}
      - INTERNAL_API_URL=http://reels-api:8000
    depends_on:
      - reels-api

